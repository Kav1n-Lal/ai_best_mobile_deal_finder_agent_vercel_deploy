<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mobile Deals</title>

    <link
        rel="stylesheet"
        href="/static/css/chat.css"
    >
</head>

<body class="landing-page">

    <div class="landing-container">

        <div class="brand-icon">
            📱
        </div>

        <h1>Mobile Deals Assistant</h1>

        <p>
            Find the best mobile deals or ask questions
            about phones, retailers, stock and availability.
        </p>

        <button
            id="startChatButton"
            class="primary-button"
        >
            Start Chat
        </button>

    </div>

    <script>
        document
            .getElementById("startChatButton")
            .addEventListener("click", () => {

                const threadId = crypto.randomUUID();

                window.location.href =
                    `/chat?thread_id=${encodeURIComponent(threadId)}`;
            });
    </script>

</body>
</html>
